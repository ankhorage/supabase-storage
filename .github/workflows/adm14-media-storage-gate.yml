name: ADM-14 Supabase Media Storage Gate

on:
  push:
    branches:
      - agent/adm14-supabase-media-storage

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install and update lockfile
        run: bun install

      - name: Format authored changes
        run: bun run format

      - name: Apply strict lint fixes
        run: bun run lint:fix

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Knip
        run: bun run knip

      - name: Generate documentation
        run: bun run docs

      - name: Format generated documentation
        run: bun run format

      - name: Verify formatting
        run: bun run format:check

      - name: Verify lint
        run: bun run lint

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Verify changeset
        run: bun run changeset:status

      - name: Verify clean patches
        run: git diff --check

      - name: Remove temporary gate workflow
        run: rm .github/workflows/adm14-media-storage-gate.yml

      - name: Commit validated package state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Validate ADM-14 Supabase media storage"
            git push
          fi
